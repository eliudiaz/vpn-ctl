# =============================================================================
# SNAT INSTANCE CONFIGURATION (dynamically created from peer settings)
# =============================================================================
# If peer has provider_assigned_ip, SNAT instance is created automatically
# using cluster EKS info (discovered at runtime, NOT hardcoded)
#
# Example: apap peer with provider_assigned_ip will create:
#   - Instance name: affinity-apap-snat
#   - Instance type: t3.small (from snat_config)
#   - VPC/Subnet: Discovered from EKS cluster (dynamic, NOT hardcoded)
#   - Provider IP: 203.0.113.10/32 (from provider_assigned_ip)
#   - Destination CIDRs: 172.33.50.0/30 (from destination_cidrs)
#   - iptables SNAT rules auto-generated

# =============================================================================
# NOTES
# =============================================================================
# 1. PEER-AGNOSTIC DESIGN:
#    - Add ANY peer by updating this file
#    - No Python code changes needed
#    - VPC/Subnet auto-discovered from EKS cluster (not hardcoded)
#    - Works for dev/core AND peer-<name> stacks
#
# 2. SNAT INSTANCES:
#    - Only created if peer has provider_assigned_ip
#    - Instance type configurable per peer
#    - Automatically routes via SNAT to provider IP
#
# 3. PSK (Pre-Shared Keys):
#    - Stored in AWS Secrets Manager (not plaintext files)
#    - Auto-generated if "auto_generate_or_provide_backup"
#    - Never committed to git
#
# 4. ENABLED FLAG:
#    - Set to false to disable peer without deleting config
#    - Useful for testing and gradual rollout
