# VPN Infrastructure Configuration - UNIFIED & AGNOSTIC
# ============================================================
# Single source of truth for:
# - Tunnel profiles (IPsec/IKE config templates)
# - VPN peers (customer gateways)
# - SNAT instances (source IP translation)
#
# This config works for ANY peer - no hardcoded AWS IDs.

# =============================================================================
# TUNNEL PROFILES - IPsec/IKE Configuration Templates
# =============================================================================
tunnel_profiles:
  checkpoint_r80:
    description: "Checkpoint R80.10 compatible (Vimenca standard)"
    ike_versions: ["ikev2"]
    phase1:
      encryption: ["AES256"]
      integrity: ["SHA2-256"]
      dh_groups: [14]
      lifetime: 28800
    phase2:
      encryption: ["AES256"]
      integrity: ["SHA2-256"]
      dh_groups: []
      lifetime: 3600
    dpd:
      timeout: 30
      action: "restart"
    static_routes_only: true

  fortigate_standard:
    description: "Fortinet FortiGate standard profile (IKEv2 with PFS)"
    ike_versions: ["ikev2"]
    phase1:
      encryption: ["AES256"]
      integrity: ["SHA2-256"]
      dh_groups: [14]
      lifetime: 28800
    phase2:
      encryption: ["AES256"]
      integrity: ["SHA2-256"]
      dh_groups: [14]
      lifetime: 3600
    dpd:
      timeout: 30
      action: "restart"
    pfs_enabled: true
    static_routes_only: true

  palo_alto_standard:
    description: "Palo Alto Networks standard profile"
    ike_versions: ["ikev1", "ikev2"]
    phase1:
      encryption: ["AES256"]
      integrity: ["SHA2-256"]
      dh_groups: [14]
      lifetime: 28800
    phase2:
      encryption: ["AES256"]
      integrity: ["SHA2-256"]
      dh_groups: [14]
      lifetime: 3600
    dpd:
      timeout: 10
      action: "clear"
    static_routes_only: false

