# VPN Pool Registry - Tracks reusable VPN resources
#
# This file maintains the state of all VPN connections managed by the infrastructure.
# VPNs in this pool can be:
# - attached: Currently in use by a peer
# - detached: Preserved for reuse (not in use)
# - orphaned: Existing but not managed (rare)
#
# When a peer is destroyed, its VPN is marked as detached (not deleted).
# When a new peer is deployed, it can reuse a detached VPN with the same profile.
#
# NOTE: This is a template. Replace placeholder values with actual resource IDs from your AWS account.

version: '1.0'
