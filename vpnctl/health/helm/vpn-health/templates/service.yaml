apiVersion: v1
kind: Service
metadata:
  name: vpn-health
  namespace: {{ .Values.namespace | default "vpn-health" }}
  labels:
    app: vpn-health
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: vpn-health
