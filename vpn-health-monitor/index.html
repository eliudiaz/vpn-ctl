<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Health Monitor Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
        }

        .status-healthy {
            background: #10b981;
            color: white;
        }

        .status-unhealthy {
            background: #ef4444;
            color: white;
        }

        .status-warning {
            background: #f59e0b;
            color: white;
        }

        .header-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .provider-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .provider-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .provider-name {
            font-size: 20px;
            font-weight: 700;
        }

        .provider-description {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .targets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .target {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .target:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        .target-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .target-ip {
            color: #666;
            font-size: 12px;
            font-family: 'Monaco', 'Courier New', monospace;
            margin-bottom: 10px;
        }

        .protocols {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .protocol-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background: #e5e7eb;
            color: #333;
            position: relative;
        }

        .protocol-badge.icmp {
            background: #dbeafe;
            color: #0284c7;
        }

        .protocol-badge.tcp {
            background: #fce7f3;
            color: #be185d;
        }

        .protocol-badge.http {
            background: #fef3c7;
            color: #b45309;
        }

        .protocol-badge.https {
            background: #d1fae5;
            color: #047857;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
        }

        .metric-label {
            color: #666;
        }

        .metric-value {
            font-weight: 600;
            color: #333;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-indicator.success {
            background: #d1fae5;
            color: #047857;
        }

        .status-indicator.timeout {
            background: #fed7aa;
            color: #b45309;
        }

        .status-indicator.unreachable {
            background: #fee2e2;
            color: #dc2626;
        }

        .status-indicator.error {
            background: #fce7f3;
            color: #be185d;
        }

        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .cluster-info {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .cluster-info h3 {
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: #f9fafb;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .info-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            color: #333;
            font-weight: 600;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            word-break: break-all;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .last-update {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }

        .icon {
            display: inline-block;
            width: 20px;
            height: 20px;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                🛡️ VPN Health Monitor Dashboard
            </h1>
            <div id="mainStatus" class="status-badge status-healthy">Loading...</div>

            <div class="header-stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalTargets">-</div>
                    <div class="stat-label">Total Targets</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="healthyCount">-</div>
                    <div class="stat-label">Healthy</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="unhealthyCount">-</div>
                    <div class="stat-label">Unhealthy</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="errorCount">-</div>
                    <div class="stat-label">Errors</div>
                </div>
            </div>
            <div class="last-update" id="lastUpdate"></div>
        </header>

        <div id="error" style="display: none;"></div>

        <div id="clusterInfo" class="cluster-info" style="display: none;">
            <h3>📍 Pod & Cluster Information</h3>
            <div class="info-grid" id="clusterInfoGrid"></div>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading health data...</p>
            </div>
        </div>

        <footer>
            VPN Health Monitor • Continuous Provider Connectivity Tracking
        </footer>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let refreshInterval;

        async function fetchData() {
            try {
                const [healthRes, clusterRes] = await Promise.all([
                    fetch(`${API_BASE}/health`),
                    fetch(`${API_BASE}/cluster-info`)
                ]);

                if (!healthRes.ok) throw new Error(`Health API error: ${healthRes.status}`);

                const health = await healthRes.json();
                const clusterData = clusterRes.ok ? await clusterRes.json() : null;

                updateDashboard(health);
                if (clusterData) updateClusterInfo(clusterData);
                updateLastUpdate();
                clearError();
            } catch (error) {
                showError(error.message);
                console.error('Fetch error:', error);
            }
        }

        function updateDashboard(data) {
            const dashboard = document.getElementById('dashboard');
            const stats = data.statistics || {};

            document.getElementById('totalTargets').textContent = stats.total_targets || 0;
            document.getElementById('healthyCount').textContent = stats.healthy || 0;
            document.getElementById('unhealthyCount').textContent = stats.unhealthy || 0;
            document.getElementById('errorCount').textContent = stats.errors || 0;

            const mainStatus = document.getElementById('mainStatus');
            if (stats.unhealthy > 0) {
                mainStatus.textContent = '⚠️ Partially Degraded';
                mainStatus.className = 'status-badge status-warning';
            } else if (stats.errors > 0) {
                mainStatus.textContent = '🔴 Errors Detected';
                mainStatus.className = 'status-badge status-unhealthy';
            } else {
                mainStatus.textContent = '✅ All Systems Healthy';
                mainStatus.className = 'status-badge status-healthy';
            }

            dashboard.innerHTML = '';
            const providers = data.providers || {};

            if (Object.keys(providers).length === 0) {
                dashboard.innerHTML = '<p class="loading">No providers configured</p>';
                return;
            }

            for (const [providerName, providerData] of Object.entries(providers)) {
                const card = createProviderCard(providerName, providerData);
                dashboard.appendChild(card);
            }
        }

        function createProviderCard(name, data) {
            const card = document.createElement('div');
            card.className = 'provider-card';

            const headerBg = getProviderColor(name);
            const header = document.createElement('div');
            header.className = 'provider-header';
            header.style.background = headerBg;
            header.innerHTML = `
                <div>
                    <div class="provider-name">${name}</div>
                    <div class="provider-description">${data.description || ''}</div>
                </div>
                <div class="status-badge status-${data.status === 'healthy' ? 'healthy' : 'unhealthy'}" style="color: white; background: rgba(255,255,255,0.3);">
                    ${data.status === 'healthy' ? '✅ Healthy' : '⚠️ Unhealthy'}
                </div>
            `;
            card.appendChild(header);

            const targetsGrid = document.createElement('div');
            targetsGrid.className = 'targets-grid';

            const targets = data.targets || [];
            targets.forEach(target => {
                const targetEl = createTargetElement(target);
                targetsGrid.appendChild(targetEl);
            });

            card.appendChild(targetsGrid);
            return card;
        }

        function createTargetElement(target) {
            const div = document.createElement('div');
            div.className = 'target';

            const statusClass = target.status || 'error';
            const statusText = {
                'success': '✅ Success',
                'timeout': '⏱️ Timeout',
                'unreachable': '🚫 Unreachable',
                'error': '❌ Error'
            }[statusClass] || '❓ Unknown';

            const latency = target.latency_ms !== undefined ? `${target.latency_ms.toFixed(1)}ms` : 'N/A';
            const successRate = target.success_rate !== undefined ? `${target.success_rate.toFixed(1)}%` : 'N/A';
            const lastPing = target.last_ping ? new Date(target.last_ping).toLocaleTimeString() : 'Never';

            div.innerHTML = `
                <div class="target-name">
                    <span>${target.name}</span>
                </div>
                <div class="target-ip">${target.ip}${target.port ? ':' + target.port : ''}</div>
                <div class="protocols">
                    ${getProtocolBadges(target.protocol)}
                </div>
                <div class="metrics">
                    <div class="metric">
                        <span class="metric-label">Status:</span>
                        <span class="status-indicator ${statusClass}">
                            <span class="pulse" style="background: currentColor;"></span>
                            ${statusText}
                        </span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Latency:</span>
                        <span class="metric-value">${latency}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Success Rate:</span>
                        <span class="metric-value">${successRate}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Last Ping:</span>
                        <span class="metric-value">${lastPing}</span>
                    </div>
                </div>
                ${target.source_ip ? `
                    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #e5e7eb; font-size: 11px; color: #666;">
                        <strong>Source IP:</strong> <code style="font-family: monospace; color: #667eea;">${target.source_ip}</code>
                    </div>
                ` : ''}
            `;

            return div;
        }

        function getProtocolBadges(protocol) {
            if (!protocol) return '';
            const protocols = Array.isArray(protocol) ? protocol : [protocol];
            return protocols.map(p => {
                const text = p.toUpperCase();
                return `<span class="protocol-badge ${p.toLowerCase()}">${text}</span>`;
            }).join('');
        }

        function getProviderColor(name) {
            const colors = {
                'Vimenca': 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                'CIBAO': 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                'Affinity-Legacy': 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)'
            };
            return colors[name] || 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        }

        function updateClusterInfo(data) {
            const clusterInfo = document.getElementById('clusterInfo');
            const grid = document.getElementById('clusterInfoGrid');

            const info = data.pod_network || {};
            const items = [
                { label: 'Pod Name', value: info.pod_name || 'N/A' },
                { label: 'Pod Namespace', value: info.pod_namespace || 'N/A' },
                { label: 'Pod IP', value: info.pod_ip || 'N/A' },
                { label: 'VPC CIDR', value: info.vpc_cidr || 'N/A' },
                { label: 'Cluster CIDRs', value: (info.cluster_cidrs || []).join(', ') || 'N/A' }
            ];

            grid.innerHTML = items.map(item => `
                <div class="info-item">
                    <div class="info-label">${item.label}</div>
                    <div class="info-value">${item.value}</div>
                </div>
            `).join('');

            clusterInfo.style.display = 'block';
        }

        function updateLastUpdate() {
            const now = new Date();
            const time = now.toLocaleTimeString();
            document.getElementById('lastUpdate').textContent = `Last updated: ${time} • Auto-refreshing every 10 seconds`;
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.innerHTML = `<div class="error-message">⚠️ ${message}</div>`;
            errorDiv.style.display = 'block';
        }

        function clearError() {
            document.getElementById('error').style.display = 'none';
        }

        // Initial load and setup refresh
        fetchData();
        refreshInterval = setInterval(fetchData, 10000); // Refresh every 10 seconds

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            clearInterval(refreshInterval);
        });
    </script>
</body>
</html>
