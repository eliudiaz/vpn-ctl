{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vpn-health-monitor.fullname" . }}
  labels:
    {{- include "vpn-health-monitor.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vpn-health-monitor.fullname" . }}
  labels:
    {{- include "vpn-health-monitor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vpn-health-monitor.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "vpn-health-monitor.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
{{- end }}
